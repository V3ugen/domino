<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classic Dominoes with Dots</title>
    <!-- CONNECTING STYLESHEET -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- COIN FLIP MODAL -->
<div id="coinModal" class="modal-overlay">
    <div class="modal-box">
        <h3 data-i18n="modalTitle">Coin Flip</h3>
        <p data-i18n="modalDesc">Choose your side to see who goes first:</p>
        <div id="coinVisual" class="coin-animation">🪙</div>
        <div class="modal-buttons">
            <button onclick="chooseCoin('Heads')" data-i18n="headsBtn">Heads</button>
            <button onclick="chooseCoin('Tails')" data-i18n="tailsBtn">Tails</button>
        </div>
    </div>
</div>

<!-- CHOOSE SIDE MODAL (LEFT / RIGHT) -->
<div id="choiceModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h3 data-i18n="choiceTitle">Select Side</h3>
        <p data-i18n="choiceDesc">This tile matches both ends. Where do you want to place it?</p>
        <div class="modal-buttons">
            <button onclick="playToSelectedSide('left')" data-i18n="left">Left</button>
            <button onclick="playToSelectedSide('right')" data-i18n="right" style="background-color: #28a745;">Right</button>
        </div>
    </div>
</div>

<div class="game-container">
    <div class="header-bar">
        <h2 data-i18n="gameTitle">Dominoes</h2>
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">RU</button>
    </div>
    
    <!-- Bot's Hand -->
    <div class="hand-zone">
        <div class="hand-title"><span data-i18n="botTitle">Opponent (Bot) Tiles:</span> <span id="botCount">7</span></div>
        <div id="botHand" class="bot-tiles"></div>
    </div>

    <!-- Game Status Display -->
    <div id="status" class="status-box">Game Loading...</div>

    <!-- Expanded Game Board with Wrap -->
    <div id="board" class="board-zone"></div>

    <!-- Player's Hand -->
    <div class="hand-zone">
        <div class="hand-title" data-i18n="playerTitle">Your Tiles (Click to play):</div>
        <div id="playerHand" class="tiles-container"></div>
    </div>

    <!-- Control Buttons -->
    <div class="controls">
        <button id="bazarBtn" class="bazar-btn" onclick="takeFromBazar()"><span data-i18n="marketBtn">Market</span> (<span id="bazarCount">14</span>)</button>
        <button id="restartBtn" onclick="startWithCoinFlip()" data-i18n="restartBtn">Restart</button>
    </div>
</div>

<!-- CONNECTING DATA AND LOGIC -->
<script src="domino-data.js"></script>
<script src="script.js"></script>
</body>
</html>
