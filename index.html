<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Классическое Домино</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1 class="game-title">Домино</h1>
        
        <!-- Статус-бар ходов, жребия и побед -->
        <div id="status" class="status-box">Ждём броска монетки...</div>

        <!-- ИСПРАВЛЕНО: Информационная панель противника теперь закреплена СВЕРХУ игрового поля -->
        <div class="info-panel bot-panel">
            <span>Соперник (Бот) карт на руках: <strong id="botCount">7</strong></span>
            <div id="botHand" class="hand-row hidden-hand"></div>
        </div>

        <!-- Игровое поле для выкладывания домино (с поддержкой авто-зума) -->
        <div id="board-zone" class="board-zone">
            <div id="board" class="board-lane"></div>
        </div>

        <!-- Ваша рука с костяшками (СНИЗУ экрана) -->
        <div class="info-panel player-panel">
            <span>Ваши костяшки (Нажмите для хода):</span>
            <div id="playerHand" class="hand-row"></div>
        </div>

        <!-- Нижние кнопки управления -->
        <div class="controls">
            <!-- ИСПРАВЛЕНО: Базар переименован в Привоз -->
            <button id="bazarBtn" class="bazar-btn">Привоз (14)</button>
            <button id="passBtn" class="pass-btn" style="display: none;">Пропустить ход</button>
            <button id="restartBtn" onclick="restartGame()">Заново</button>
        </div>
    </div>

    <!-- Интегрированное в интерфейс окно жребия монетки -->
    <div id="coinModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Бросок монеты</h3>
            <p>Выберите сторону, чтобы узнать, кто ходит первым:</p>
            <div id="coinVisual" class="coin-animation">🪙</div>
            <div class="modal-buttons">
                <button onclick="chooseCoin('Heads')">Орел</button>
                <button onclick="chooseCoin('Tails')">Решка</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно выбора стороны (Лево / Право) -->
    <div id="choiceModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Выбор стороны</h3>
            <p>Костяшка подходит к обоим краям. Куда её поставить?</p>
            <div class="modal-buttons">
                <button onclick="playToSelectedSide('left')">Лево</button>
                <button onclick="playToSelectedSide('right')" style="font-weight: bold;">Право</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
